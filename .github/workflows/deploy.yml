# Continuous delivery to AWS on every merge to main (after CI passes).
# Auth: GitHub OIDC → IAM role (no long-lived keys). Requires repository variables:
#   AWS_ACCOUNT_ID, AWS_REGION, AWS_DEPLOY_ROLE_ARN, ALARM_EMAIL, MAIL_FROM, BOOTSTRAP_ADMIN_EMAILS
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write # OIDC
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
      url: ${{ steps.outputs.outputs.app_url }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
      CDK_DEFAULT_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.IMAGE_TAG }}" }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build & push image (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: APP_VERSION=${{ env.IMAGE_TAG }}
          tags: ${{ steps.ecr.outputs.registry }}/gharkhoj-web:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: pnpm/action-setup@v4
        with: { version: "9.15.9" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: cdk deploy
        working-directory: infra
        run: |
          pnpm cdk deploy --all --require-approval never --concurrency 2 \
            -c imageTag=$IMAGE_TAG \
            -c alarmEmail="${{ vars.ALARM_EMAIL }}" \
            -c mailFrom="${{ vars.MAIL_FROM }}" \
            -c bootstrapAdminEmails="${{ vars.BOOTSTRAP_ADMIN_EMAILS }}" \
            --outputs-file cdk-outputs.json
      - name: Read outputs
        id: outputs
        run: echo "app_url=$(jq -r '."gharkhoj-app".AppUrl' infra/cdk-outputs.json)" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        run: |
          URL="${{ steps.outputs.outputs.app_url }}"
          for i in $(seq 1 30); do
            body=$(curl -sf "$URL/api/health") && echo "$body" | grep -q "\"version\":\"$IMAGE_TAG\"" && { echo "Healthy: $body"; exit 0; }
            sleep 10
          done
          echo "Smoke test failed"; exit 1
