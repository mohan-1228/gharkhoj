# Continuous integration: every push and pull request.
# Quality gates: lint → typecheck → unit → integration (PostGIS + MinIO) → build → e2e → infra tests/synth.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.9"

jobs:
  quality:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Dependency audit (production deps)
        run: pnpm audit --prod --audit-level high

  integration:
    name: Integration + E2E (PostGIS, MinIO, Mailpit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_USER: gharkhoj, POSTGRES_PASSWORD: gharkhoj, POSTGRES_DB: gharkhoj }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U gharkhoj" --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.21
        ports: ["1025:1025", "8025:8025"]
    env:
      DATABASE_URL: postgresql://gharkhoj:gharkhoj@localhost:5433/gharkhoj?schema=public
      TEST_DATABASE_URL: postgresql://gharkhoj:gharkhoj@localhost:5433/gharkhoj_test?schema=public
      APP_URL: http://localhost:3100
      AUTH_MODE: dev
      SESSION_SECRET: ci-session-secret-0123456789abcdef0123456789abcdef
      INTERNAL_API_SECRET: ci-internal-secret-0123456789abcdef0123456789ab
      S3_BUCKET: gharkhoj-media
      S3_ENDPOINT: http://localhost:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      MEDIA_BASE_URL: http://localhost:9000/gharkhoj-media
      MAIL_TRANSPORT: smtp
      E2E_PORT: "3100"
      ALLOW_DEV_AUTH: "true" # production build + dev sign-in for E2E only
    steps:
      - uses: actions/checkout@v4
      - name: Start MinIO (needs a command, so not a service container)
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            cgr.dev/chainguard/minio:latest server /data
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && break; sleep 1; done
      - name: Create test database
        run: |
          PGPASSWORD=gharkhoj psql -h localhost -p 5433 -U gharkhoj -d gharkhoj -c "CREATE DATABASE gharkhoj_test;"
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm db:migrate
      - run: pnpm storage:setup
      - run: pnpm db:seed
      - run: pnpm test:integration
      - run: pnpm build
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env: { CI: "true" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }

  infra:
    name: Infrastructure tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir infra typecheck
      - run: pnpm --dir infra test

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: gharkhoj-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
